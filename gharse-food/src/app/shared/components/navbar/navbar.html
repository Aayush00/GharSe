<nav class="navbar">
  <!-- LEFT -->
  <div class="nav-left">
    <a routerLink="/" class="logo">GharSeFood</a>
  </div>

  <!-- CENTER -->
  <div class="nav-center">
    <div class="search-container">
      <!-- LOCATION -->
      <div class="location-box">
        <span class="icon">📍</span>
        <select [ngModel]="selectedLocation" (ngModelChange)="onLocationChange($event)">
          <option value="">Select Location</option>
          <option *ngFor="let loc of availableLocations" [value]="loc">
            {{ loc }}
          </option>
        </select>
      </div>

      <span class="divider"></span>

      <!-- SEARCH -->
      <div class="search-box">
        <span class="icon">🔍</span>
        <input
          type="text"
          placeholder="Search for restaurant, cuisine or dish"
          [(ngModel)]="searchText"
          (input)="onSearchInput()"
          (focus)="showDropdown = true"
        />
        <!-- CLEAR BUTTON -->
        <span
          class="clear-icon"
          *ngIf="searchText"
          (click)="clearSearch()"
          aria-label="Clear search"
        >
          ✕
        </span>

        <!-- DROPDOWN -->
        <div class="search-dropdown" *ngIf="showDropdown">
          <div
            class="dropdown-item"
            *ngFor="let item of searchResults"
            (click)="openChef(item.chefId)"
          >
            <div class="item-name">{{ item.itemName }}</div>
            <div class="chef-name">from {{ item.chefName }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="nav-right">
    <div class="mode-buttons">
      <button class="mode-btn active">Delivery</button>
      <button class="mode-btn">Pickup</button>
    </div>

    <!-- If user not logged in -->
    <a *ngIf="!authService.isLoggedIn()" routerLink="/login" class="login-link"> Login </a>

    <!-- If user logged in -->
    <div *ngIf="authService.isLoggedIn()" class="user-section">
      <div class="avatar">
        {{ userProfile?.customerName?.charAt(0) || 'U' }}
      </div>

      <span class="username">
        {{ userProfile?.customerName || 'User' }}
      </span>

      <button (click)="logout()" class="logout-btn">Logout</button>
    </div>
  </div>
</nav>
