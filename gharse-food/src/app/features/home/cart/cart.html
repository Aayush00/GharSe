<div class="cart-wrapper">
  <div class="cart-page">
    <h2>{{ chefName }}</h2>
    <p class="subtitle">Homemade food • Fresh • Hygienic</p>

    <div *ngFor="let item of items" class="cart-item">
      <img [src]="item.imageUrl || 'assets/food-placeholder.png'" />

      <div class="details">
        <h4>{{ item.name }}</h4>
        <p>₹{{ item.price }}</p>

        <div class="stepper">
          <button (click)="decrement(item)">−</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increment(item)">+</button>
        </div>
      </div>

      <div class="amount">₹{{ item.price * item.quantity }}</div>
    </div>

    <div class="footer">
      <button class="add-more" (click)="addMoreItems()">+ Add more items</button>

      <div class="checkout-section">
        <span class="total">Total: ₹{{ total }}</span>
        <button class="checkout">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</div>
