<div class="home-food-section">
  <h2 class="title">🍲 Explore Our Special Dishes</h2>

  <div class="food-container">
    <div class="food-card" *ngFor="let food of foods; let i = index">
      <div class="food-img">
        <img [src]="food.image ? food.image : getRandomImage(i)" alt="{{ food.name }}" />
        <span class="rating">⭐ {{ food.rating || 4.5 }}</span>
      </div>

      <div class="food-details">
        <h3>{{ food.name }}</h3>

        <p class="chef-name">👨‍🍳 {{ food.chefName }}</p>

        <div class="price">₹{{ food.price }}</div>
      </div>
    </div>
  </div>
</div>
