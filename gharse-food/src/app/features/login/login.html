<div class="login-modal-container" *ngIf="showLogin">
  <div class="login-modal">
    <button class="close-btn" (click)="closeLogin()">×</button>

    <h2 class="title" *ngIf="!otpSent">
      {{ isSignUp ? 'Create Account' : 'Login' }}
    </h2>

    <h2 class="title" *ngIf="otpSent">
      Verify OTP
    </h2>

    <p class="subtitle" *ngIf="otpSent">
      OTP sent to <strong>{{ maskedMobile }}</strong>
      <button class="link" type="button" (click)="editNumber()">Change</button>
    </p>

    <!-- PHONE + SIGNUP FIELDS -->
    <div class="form-group" *ngIf="!otpSent">

      <label>Phone Number</label>
      <input
        type="text"
        [(ngModel)]="mobileNumber"
        maxlength="10"
        (keypress)="allowOnlyNumbers($event)"
        placeholder="Enter 10-digit number"
      />

      <div *ngIf="isSignUp">

        <label>Full Name</label>
        <input type="text"
               [(ngModel)]="fullName"
               placeholder="Your full name" />

        <label>Email</label>
        <input type="email"
               [(ngModel)]="email"
               placeholder="Your email address" />

      </div>

      <button class="btn btn-login" (click)="sendOtp()">
        {{ isSignUp ? 'Sign Up' : 'Login' }}
      </button>

    </div>

    <!-- OTP SECTION -->
    <div class="form-group" *ngIf="otpSent">

      <label>Enter OTP</label>
      <input
        type="text"
        [(ngModel)]="otp"
        maxlength="6"
        (keypress)="allowOnlyNumbers($event)"
        placeholder="6-digit OTP"
      />

      <button class="btn btn-verify" (click)="verifyOtp()">
        Verify OTP
      </button>

    </div>

    <div class="status">{{ statusMessage }}</div>

    <p class="footer-text" *ngIf="!otpSent">
      {{ isSignUp ? 'Already have an account?' : "Don't have an account?" }}
      <button class="link" (click)="toggleSignUp()">
        {{ isSignUp ? 'Login' : 'Create an account' }}
      </button>
    </p>

    <!-- 🔥 Required for Firebase -->
    <div id="recaptcha-container"></div>

  </div>
</div>
